# ============================================================================
# Plutus — Workflow Data Fabric v2 Pricing & Packaging Configuration
# ============================================================================
# This file is the single source of truth for WDF credit calculations.
# All values are editable — pricing changes should be made here, not in code.
#
# Sources:
#   - Workflow Data Fabric - Pricing & Packaging Deck (2025-Q4)
#   - D&A PreSKO Day 3 WDF
#   - ATO WDF Credit Sizing Model
# ============================================================================

# ---------------------------------------------------------------------------
# Pack Definitions
# ---------------------------------------------------------------------------
packs:
  credits_per_pack: 2_000_000          # 2M fabric credits per pack
  price_per_pack_yearly: 100_000       # $100k per pack per year

# ---------------------------------------------------------------------------
# Tier Definitions
# ---------------------------------------------------------------------------
tiers:
  standard:
    label: "WDF Standard"
    product_code: "PROD26897"
    min_packs: 1                       # 1 pack = $100k/yr = 2M credits
    capabilities:
      - integration_hub
      - orchestration
      - external_content_connectors
      - api_access_volume
      - rpa_hub
      - now_assist_for_spokes
      - ai_data_explorer
      - automation_center

  professional:
    label: "WDF Professional"
    product_code: "PROD26898"
    min_packs: 4                       # 4 packs = $400k/yr = 8M credits
    capabilities:                      # All Standard capabilities PLUS:
      - integration_hub
      - orchestration
      - external_content_connectors
      - api_access_volume
      - rpa_hub
      - now_assist_for_spokes
      - ai_data_explorer
      - automation_center
      - stream_connect
      - zero_copy_connectors
      - data_catalog

# ---------------------------------------------------------------------------
# Credit Rate Card
# ---------------------------------------------------------------------------
# Each capability has:
#   id            — internal key
#   label         — display name
#   description   — what is metered
#   meter_unit    — unit of measurement
#   credits       — fabric credits consumed per meter_unit
#   pro_only      — true if only available in Professional tier
#   scan_tables   — ServiceNow tables to scan for usage evidence
#   scan_method   — how to estimate usage (count, sum, log_count, manual)
#   measurable    — true if Plutus can auto-measure from the instance;
#                   false = "Not Measured" section (manual entry only)
#   measurement_rule — human-readable explanation of how usage is measured
# ---------------------------------------------------------------------------
rate_card:

  - id: integration_hub
    label: "Integration Hub"
    description: >
      Outbound call originating from Integration Hub, Flow Designer,
      Remote Tables, or Orchestration
    meter_unit: "Data fabric transaction"
    credits: 1
    pro_only: false
    measurable: true
    scan_tables:
      - sys_outbound_http_log
    scan_method: log_count
    scan_hint: "Counts actual outbound HTTP executions from IHub flow steps"
    measurement_rule: >
      Count of records in sys_outbound_http_log where
      source_table = sys_hub_step_instance. Each row represents
      one real outbound call made by an Integration Hub flow.

  - id: api_access_volume
    label: "API Access Volume"
    description: >
      Data egressed to 3rd party via ServiceNow public APIs
    meter_unit: "MB"
    credits: 1
    pro_only: false
    measurable: true
    scan_tables:
      - sys_outbound_http_log
    scan_method: estimate
    scan_hint: "Estimates MB from sampled outbound HTTP payload sizes × total call count"
    measurement_rule: >
      Samples response_length from sys_outbound_http_log, computes
      average payload size, then multiplies by the total outbound
      HTTP call count to estimate total MB egressed.

  - id: rpa_hub
    label: "RPA Bots"
    description: >
      Minutes of runtime by an unattended or attended robot.
      An "attended" robot is assigned to a user and an "Unattended"
      robot is assigned to a Virtual Machine in the RPA Hub application.
    meter_unit: "Minute"
    credits: 5
    pro_only: false
    measurable: true
    scan_tables:
      - sn_rpa_execution
    scan_method: log_count
    scan_hint: "Counts actual RPA execution records for runtime minutes"
    measurement_rule: >
      Count of records in sn_rpa_execution. If not accessible,
      falls back to sn_rpa_robot count (definitions only). Actual
      runtime minutes may require manual entry if execution logs
      are ACL-restricted.

  - id: zero_copy_connectors
    label: "Zero Copy Connectors (SQL)"
    description: >
      Data volume processed via Zero Copy to external SQL databases
    meter_unit: "MB"
    credits: 1
    pro_only: true
    measurable: true
    scan_tables:
      - sys_data_source
      - sys_outbound_http_log
      - sys_rest_message
    scan_method: detect_supported_db
    scan_hint: "Detects JDBC data sources and REST/IHub calls to ZCC-supported databases"
    measurement_rule: >
      Scans three sources to identify connections to ZCC-supported databases:
      1. JDBC data sources (sys_data_source, type=JDBC) — matches connection_url
         against supported DB patterns (e.g. jdbc:sqlserver, jdbc:oracle).
      2. REST messages (sys_rest_message) — matches endpoint names against
         supported DB spoke names (e.g. Snowflake, BigQuery).
      3. Outbound HTTP logs (sys_outbound_http_log) — matches actual call URLs
         and hostnames against supported DB patterns.
      Reports the count of unique supported databases detected. MB volume
      must be entered manually from Subscription Usage dashboard.

  - id: zero_copy_connectors_erp
    label: "Zero Copy Connectors for ERP"
    description: >
      Volume of data read from or written to an ERP system
    meter_unit: "MB"
    credits: 1
    pro_only: true
    measurable: false
    scan_tables: []
    scan_method: manual
    scan_hint: "ZCC ERP volume is metered at the platform level"
    measurement_rule: >
      Cannot be auto-measured. Enter MB volume from Subscription
      Usage dashboard or ERP integration monitoring.

  - id: stream_connect
    label: "Stream Connect for Apache Kafka"
    description: >
      Data volume ingressed or egressed via Hermes / Apache Kafka
    meter_unit: "MB"
    credits: 1
    pro_only: true
    measurable: true
    scan_tables:
      - sys_outbound_http_log
      - sys_import_set_run
      - sys_import_set_row
    scan_method: detect_kafka_indicators
    scan_hint: "Detects high-frequency IHub messages and batch imports as Kafka/Stream Connect indicators"
    measurement_rule: >
      Detects Stream Connect candidates by identifying high-frequency
      messaging patterns:
      1. High-volume IHub outbound calls (sys_outbound_http_log where
         source_table=sys_hub_step_instance) — large call counts indicate
         event-driven or streaming integration patterns ideal for Kafka.
      2. High-frequency import set runs (sys_import_set_run) with large
         row volumes (sys_import_set_row) — batch ingestion patterns
         that benefit from streaming.
      Reports detection as candidate with call/import counts.
      MB volume must be entered manually from Kafka monitoring.

  - id: data_catalog
    label: "Data Catalog"
    description: >
      Daily count of governed data assets — cataloged entities such as
      tables, views, models, reports, etc. — enriched with metadata,
      lineage, or business context in the Data Catalog
    meter_unit: "Data Asset"
    credits: 1
    pro_only: true
    measurable: false
    scan_tables: []
    scan_method: manual
    scan_hint: "Data Catalog is a new capability — asset count is not accessible via REST"
    measurement_rule: >
      Cannot be auto-measured. Candidate detection flags instances
      with large custom table estates or high report/dashboard counts
      as Data Catalog opportunities.

  - id: ai_data_explorer
    label: "AI Data Explorer"
    description: >
      Count of explorations with content created
    meter_unit: "Exploration"
    credits: 10
    pro_only: false
    measurable: true
    scan_tables:
      - sys_report
      - pa_dashboards
    scan_method: detect_report_vs_access
    scan_hint: "Detects high report count as indicator for AI Data Explorer adoption"
    measurement_rule: >
      Measures the report and dashboard estate to identify AI Data Explorer
      candidates. A large number of reports (sys_report) and dashboards
      (pa_dashboards) — especially many reports with low individual access
      — indicates users are creating many narrow views of data, which is
      a strong signal for AI Data Explorer adoption.
      Reports the total count of reports/dashboards as evidence.
      Actual exploration count must be entered manually.

  - id: external_content_connectors
    label: "External Content Connectors"
    description: >
      External document indexed via AI Search IntegrationHub Spoke,
      External Content REST API, or External Content Connectors
    meter_unit: "Document indexed"
    credits: 1
    pro_only: false
    measurable: false
    scan_tables: []
    scan_method: manual
    scan_hint: "Document indexing count is not accessible via REST API"
    measurement_rule: >
      Cannot be auto-measured. Count of indexed documents requires
      access to AI Search internals or External Content Connector
      configuration.


# ---------------------------------------------------------------------------
# Supported Databases for Zero Copy Connectors
# ---------------------------------------------------------------------------
# Used to identify ZCC candidates: if an instance has JDBC data sources
# or IHub spokes connecting to these databases, they are ZCC candidates.
# ---------------------------------------------------------------------------
zcc_supported_databases:
  - name: "SQL Server"
    jdbc_patterns: ["sqlserver", "mssql", "microsoft sql"]
    spoke_names: ["Microsoft SQL Server"]

  - name: "Oracle"
    jdbc_patterns: ["oracle", "ojdbc"]
    spoke_names: ["Oracle Database"]

  - name: "MySQL"
    jdbc_patterns: ["mysql"]
    spoke_names: ["MySQL"]

  - name: "PostgreSQL"
    jdbc_patterns: ["postgresql", "postgres"]
    spoke_names: ["PostgreSQL"]

  - name: "Snowflake"
    jdbc_patterns: ["snowflake"]
    spoke_names: ["Snowflake"]

  - name: "SAP HANA"
    jdbc_patterns: ["sap", "hana"]
    spoke_names: ["SAP", "SAP HANA"]

  - name: "Amazon Redshift"
    jdbc_patterns: ["redshift"]
    spoke_names: ["Amazon Redshift"]

  - name: "Google BigQuery"
    jdbc_patterns: ["bigquery"]
    spoke_names: ["Google BigQuery"]

  - name: "Databricks"
    jdbc_patterns: ["databricks"]
    spoke_names: ["Databricks"]

  - name: "IBM Db2"
    jdbc_patterns: ["db2", "ibm"]
    spoke_names: ["IBM Db2"]


# ---------------------------------------------------------------------------
# Candidate Detection Rules
# ---------------------------------------------------------------------------
# Rules that identify opportunities where WDF capabilities would add value
# based on existing instance behavior. Each rule checks instance data and
# recommends a WDF capability.
# ---------------------------------------------------------------------------
candidate_rules:

  - id: ZCC-001
    name: "High-Volume JDBC to Supported Database"
    description: >
      Instance has JDBC data sources connecting to ZCC-supported databases.
      These are candidates for Zero Copy Connectors to eliminate ETL overhead.
    check: jdbc_to_supported_db
    min_data_sources: 1
    recommends: zero_copy_connectors
    message: >
      {count} JDBC data source(s) connecting to {databases}. These are
      candidates for Zero Copy Connectors — eliminate ETL and query live data.

  - id: ZCC-002
    name: "IHub Spokes to Supported Databases"
    description: >
      Integration Hub spokes configured for database operations on
      ZCC-supported databases. High-volume spoke calls to databases
      are ideal ZCC candidates.
    check: ihub_spoke_to_supported_db
    recommends: zero_copy_connectors
    message: >
      Integration Hub spokes detected for {databases}. If these perform
      high-volume reads, consider Zero Copy Connectors for direct SQL access.

  - id: SC-001
    name: "High-Frequency Batch Imports"
    description: >
      Instance has high-frequency scheduled import sets suggesting
      large data movement patterns. Stream Connect can replace batch
      ETL with real-time event streaming.
    check: high_frequency_imports
    min_import_sets: 50
    min_data_sources: 10
    recommends: stream_connect
    message: >
      {import_count} import sets and {ds_count} data sources detected.
      High-frequency batch patterns are candidates for Stream Connect
      (Apache Kafka) for real-time streaming.

  - id: SC-002
    name: "Large Outbound Message Volume"
    description: >
      Instance has many outbound REST/SOAP integrations suggesting
      significant data egress. Stream Connect can handle high-throughput
      bidirectional data flow more efficiently.
    check: large_outbound_volume
    min_rest_messages: 30
    recommends: stream_connect
    message: >
      {rest_count} REST message configurations detected. Consider Stream
      Connect for high-throughput bidirectional data exchange patterns.

  - id: DC-001
    name: "High Ad-Hoc Report Usage"
    description: >
      Instance has many reports and dashboards suggesting data exploration
      needs. Data Catalog and AI Data Explorer can provide governed,
      AI-powered data discovery.
    check: high_report_usage
    min_reports: 100
    recommends: data_catalog
    also_recommends: ai_data_explorer
    message: >
      {report_count} reports/dashboards detected. Data Catalog provides
      governed metadata and lineage. AI Data Explorer enables natural-language
      data exploration.

  - id: DC-002
    name: "Large Table Estate Without Governance"
    description: >
      Instance has many custom tables without centralized data governance.
      Data Catalog can provide metadata management, lineage tracking,
      and business glossary across the data estate.
    check: large_table_estate
    min_custom_tables: 50
    recommends: data_catalog
    message: >
      {table_count} custom tables detected. Data Catalog can provide
      centralized governance, metadata enrichment, and lineage tracking.


# ---------------------------------------------------------------------------
# Excluded from WDF v2 SKUs (informational)
# ---------------------------------------------------------------------------
excluded_from_wdf_v2:
  - "DocIntel"
  - "App Engine"
  - "Process Mining"
  - "Predictive Intelligence"
  - "Lens"

# ---------------------------------------------------------------------------
# Boomi API Management (included at $0)
# ---------------------------------------------------------------------------
boomi:
  included: true
  annual_call_limit: 50_000_000        # 50M API calls per year
  note: "Auto-attached $0 SKU with WDF Standard and Professional. Not for Public Sector."
